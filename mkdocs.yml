# The documentation site. Build it with scripts/docs.sh, which runs cargo doc first so the
# Rust API reference is included; `uv run --group docs mkdocs serve` previews the rest.
# Pages under docs/ are written by hand; scripts/docs_gen.py generates the rest from the
# repository on every build (the API references, the plugin catalogue, the decisions and
# the CLI usage), so they cannot drift from the code.
site_name: cmd
site_description: A launcher for macOS in the place of Spotlight, extended in Python.
repo_url: https://github.com/brukhabtu/cmd
repo_name: brukhabtu/cmd
docs_dir: docs
site_dir: site
# Where each release publishes the site (.github/workflows/pages.yml). The 404 page needs it
# for links that work under /cmd/, and the sitemap for its addresses.
site_url: https://brukhabtu.github.io/cmd/
# Folder URLs (page/) need a server that maps them to index.html, as GitHub Pages does; set
# MKDOCS_DIRECTORY_URLS=false to browse the files from disk.
use_directory_urls: !ENV [MKDOCS_DIRECTORY_URLS, true]

# The LikeC4 model's sources live under docs/architecture/; the site shows the prose in
# architecture.md, and the model gets its own export in the documentation epic.
exclude_docs: |
  /architecture/
  SUMMARY.md

# rustdoc's output, copied in by scripts/docs_gen.py, ships its font licence as a .md file.
not_in_nav: |
  /reference/rust/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/docs_gen.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - python/cmd-sdk/src
            - plugins/calculator/src
            - plugins/websearch/src
            - plugins/files/src
            - plugins/system/src
            - plugins/applications/src
            - plugins/vault/src
            - plugins/search/src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Use cmd:
      - use/index.md
      - Install: use/install.md
      - Everyday use: use/everyday.md
      - Plugins: use/plugins.md
      - Plugins in the index: use/catalogue.md
      - The vault plugin: use/vault.md
      - The search plugin: use/search.md
      - Troubleshooting: use/troubleshooting.md
  - Write a plugin:
      - plugins/index.md
      - Tutorial: plugins/tutorial.md
      - The protocol: plugin-protocol.md
      - Example plugins: plugins/examples.md
      - Testing: plugins/testing.md
      - Publishing: plugins/publishing.md
      - SDK reference: reference/python/
  - Work on the core:
      - core/index.md
      - Setting up: core/setup.md
      - Architecture: architecture.md
      - The crates: core/crates.md
      - Rust API: core/rust-api.md
      - How work moves: core/process.md
      - Skills: skills.md
      - Decisions: core/decisions/
  - Reference:
      - reference/index.md
      - Command line: reference/cli.md
