[package]
name = "cmd-host"
description = "The imperative shell around plugins: finds them, runs them as processes, and speaks the protocol over their stdin and stdout."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cmd-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
# Host events travel on a channel the window's executor can await and a test can block on.
async-channel = "2"
# A plugin whose files change is started again, so authors see edits without restarting the app.
notify = "8"

[lints]
workspace = true
