name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    name: everything that builds everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The Rust toolchain rust-toolchain.toml pins, with its components
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Python 3.15 for the plugins
        run: uv python install 3.15
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code CLI, for plugin validation
        run: npm install --global @anthropic-ai/claude-code
      - run: scripts/check.sh
        env:
          # The docs-site artifact is browsed from disk, where folder URLs do not resolve.
          MKDOCS_DIRECTORY_URLS: "false"
      - name: The documentation site check.sh built, to download and browse
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

  app:
    name: the GPUI app, on the platform it targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: The Rust toolchain rust-toolchain.toml pins, with its components
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p cmd-app --all-targets -- -D warnings
      - name: The AppKit path for icons, against a system application and a symbol
        run: cargo test -p cmd-app
      # cargo-bundle takes minutes to compile; cache the binary by its version alone.
      - id: cargo-bundle
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: cargo-bundle-0.12.0-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-bundle.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --version 0.12.0 --locked
      - name: cmd.app, with uv beside the binary, checked and zipped
        run: scripts/bundle.sh
      - name: The bundle as an artifact, on every push and pull request
        uses: actions/upload-artifact@v4
        with:
          name: cmd.app
          path: target/release/bundle/osx/cmd.app.zip
          if-no-files-found: error
