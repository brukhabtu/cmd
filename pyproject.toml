# Root of the uv workspace. Not a package: one lock, one venv, shared config.
[project]
name = "cmd-workspace"
version = "0.0.0"
description = "Workspace root for cmd's Python: the plugin SDK and the plugins."
requires-python = ">=3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/cmd-sdk", "plugins/*"]

[tool.uv.sources]
cmd-sdk = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.4", "mypy>=1.18", "ruff>=0.14"]
# pypeeker is installed from its repository, pinned to a commit on main. It is pre-1.0, so
# bump the commit deliberately and re-run the probe described under [tool.pypeeker].
arch = ["pypeeker @ git+https://github.com/brukhabtu/pypeeker@cf4f1687568e4e00d1bc7a64e0e9e4a2d660ef55"]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.ruff]
line-length = 100
preview = true
target-version = "py314"
# The vendored Claude Code plugin is written for Python 3.9 and has its own tests. The board
# is prose: ruff formats the Python blocks in Markdown, and a decision's blocks are sketches
# whose aligned comments are part of the text.
extend-exclude = [".claude", "backlog"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing commas: the formatter owns them
  "CPY001", # no copyright headers
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "D107",   # dataclasses need no __init__ docstring
  "DOC201", # docstrings explain intent and exceptions; the signature explains the return
  "DOC202", # as above
  "EM101",  # the message belongs in the raise, where the reader looks for it
  "EM102",  # as above
  "RUF067", # a package's __init__ may re-export its public names
  "RUF201", # rule codes are how this table reads
  "TC001",  # annotations are deferred from 3.14, so a typing-only import is a plain import
  "TC002",  # as above
  "TC003",  # as above
  "TD003",  # a TODO points at the board, not an issue tracker
  "TRY003", # as EM101
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D", "ANN", "PLR2004", "INP001", "FBT", "E501"]
"scripts/**" = ["T201", "INP001", "S404", "S603"] # scripts print, are not a package, and check_index.py runs git
"python/cmd-sdk/src/cmd_sdk/calls.py" = ["S404", "S603"] # runs the list of arguments it is given, with no shell

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "python/cmd-sdk/src:plugins/calculator/src:plugins/websearch/src:plugins/files/src:plugins/system/src:plugins/applications/src:plugins/vault/src:plugins/search/src:scripts"
files = ["python", "plugins", "scripts"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
consider_namespace_packages = true
testpaths = [
  "python/cmd-sdk/tests",
  "plugins/calculator/tests",
  "plugins/websearch/tests",
  "plugins/files/tests",
  "plugins/system/tests",
  "plugins/applications/tests",
  "plugins/vault/tests",
  "plugins/search/tests",
  "scripts/tests",
]

[tool.pypeeker]
src = [
  "python/cmd-sdk/src",
  "plugins/calculator/src",
  "plugins/websearch/src",
  "plugins/files/src",
  "plugins/system/src",
  "plugins/applications/src",
  "plugins/vault/src",
  "plugins/search/src",
]
rules = [
  "import-boundaries",
  "no-import-cycles",
  "unused-imports",
  "star-imports",
  "import-time-side-effects",
]

# Units are the modules directly under each top-level package (the rule's per-file root).
# The core/shell line inside the SDK: protocol takes data and returns data and imports no
# shell; serve is the only module that may import protocol. The same line holds for the
# helpers: locate (what a variable or a TOML text means) and expiry (when a value is old)
# are pure and import nothing; environment and cache are their shells, calls only runs a
# process. In the calculator, arithmetic is
# pure and imports nothing of ours, and so are search in the files plugin, commands in
# the system plugin, and scan and matching in the applications plugin. A unit is named by
# its module alone, so the vault's schema and answers share their rows with the search
# plugin's: there, hits (the values a provider returns) and values (checks on one config
# value) are pure, a kind imports only them, schema the kinds, merge the schema, and answers
# the merge; memory and plugin are the shell. An import that
# crosses source roots (the SDK importing a plugin, or a plugin another plugin) is invisible
# to this rule; scripts/import_boundaries.py gates those, right after this check in
# scripts/check.sh.
[tool.pypeeker.import-boundaries]
allow = { protocol = [], locate = [], expiry = [], environment = ["locate"], calls = [], cache = ["expiry"], serve = ["protocol"], arithmetic = [], search = [], commands = [], scan = [], matching = [], schema = ["hits", "kinds", "values"], outbox = ["schema"], invocations = ["outbox", "schema"], answers = ["invocations", "merge", "outbox", "schema"], hits = [], values = ["hits"], kinds = ["hits", "values"], merge = ["hits", "kinds", "schema"] }
report-unused-allowances = true
