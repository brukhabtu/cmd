[project]
name = "watchdemo"
version = "0.1.0"
description = "A cmd plugin: watch fake tickets in a local JSON file, and be told when one moves. The demo of decision 13; no network and no credential."
requires-python = ">=3.15"
license = "MIT"
dependencies = ["cmd-sdk"]

[project.scripts]
watchdemo = "watchdemo:main"

[tool.uv.sources]
cmd-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
