[project]
name = "websearch"
version = "0.1.0"
description = "A cmd plugin: type 'web' and a question, press Enter to search the web for it."
requires-python = ">=3.15"
license = "MIT"
dependencies = ["cmd-sdk"]

[project.scripts]
websearch = "websearch:main"

[tool.uv.sources]
cmd-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
