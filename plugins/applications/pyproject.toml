[project]
name = "applications"
version = "0.1.0"
description = "A cmd plugin: type part of an application's name, press Enter to open it."
requires-python = ">=3.15"
license = "MIT"
dependencies = ["cmd-sdk"]

[project.scripts]
applications = "applications:main"

[tool.uv.sources]
cmd-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
